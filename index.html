<script id="research-data" type="application/json">{"content": {"report": {"intro": ["阅读目标：理解公司现在靠什么增长、利润为什么承压、教育业务的真实进展，以及这些变化对教育产品规划意味着什么。", "依据：你提供的《科大讯飞股份有限公司2026年半年度报告》，共270页。财务数据主要为2026年1—6月，资产负债为6月30日；同比指2025年同期，较年初指2025年末。页码按PDF页面标注，与正文印刷页码一致。除特别注明，金额均为人民币。公司披露、我的计算和我的判断在文中分开说明；半年报财务报告未经审计（第65页）。海外补充资料来自公司官网，保留其披露日期。\n"], "sections": [{"title": "01｜先用两分钟抓住全局", "paragraphs": ["**我的核心判断：讯飞正在把长期积累的语音、行业数据和大模型能力推向更多产品，但2026年上半年，业务扩张尚未带来整体盈利质量的同步改善。**", "只记六个数字：营收116.23亿元，同比增长6.52%；归母净亏损2.04亿元，较上年收窄；扣非归母净亏损6.37亿元，反而扩大；经营现金净流出9.45亿元；智慧教育收入34.90亿元，略降1.16%；开放平台收入37.05亿元，增长36.01%。（第7、29页）", "增长亮点在开放平台、医疗、汽车，以及教育内部的智能批阅、智慧黑板等产品。压力在于教育总体未增长、部分业务收入下滑、研发和销售投入持续增加。管理层提出“做强C端、做深B端、优选G端”，意味着更重视产品、用户和经营质量，但还需要报表持续验证。（第7、12、29、37页）", "对你的面试，最有价值的一句话是：**教育产品规划既要证明教学价值，也要证明采购、交付、持续使用和续费可以成立；海外扩张还必须回答哪些能力能复用、哪些必须本地重做。**这是基于财报和岗位方向的推论，不是公司已公布的岗位职责。"]}, {"title": "02｜讯飞到底是一家什么公司", "paragraphs": ["可以把公司理解成两层：底层做语音、语言理解、多模态和星火大模型；上层通过开放平台、行业应用、企业应用、消费者产品变现。公司既提供技术服务，也做解决方案、软件和硬件。（第9—23页）", "同一项语音能力可以服务英语考试、汽车座舱、会议转写和翻译设备；同一套教育能力可以服务学校、教育主管部门和家庭学习。公司的设想是让核心技术反复复用，并通过真实使用改进产品。（第27页）", "这也意味着它的经营逻辑较复杂：一个模型做得好，不会自动让所有业务都盈利。学校项目、企业部署、API服务和消费硬件，有不同的销售周期、毛利、交付和回款方式。阅读时必须分业务看。", "“自主可控”是公司的重点：报告称星火基于国产算力训练、推理，持续迭代通用及行业模型。同时，公司也承认国产算力存在阶段性性能和生态差距。因此它既是差异化能力，也是持续投入与工程优化的任务。（第25—27、36—37页）"]}, {"title": "03｜营收增长，但为什么还在亏损", "paragraphs": ["营收由109.11亿元升至116.23亿元，增加7.12亿元。按营业收入减营业成本计算，毛利约46.21亿元，同比增长约5.27%；综合毛利率约39.75%，上年约40.23%，下降约0.47个百分点。（依据第28、72页计算）", "毛利还要覆盖期间费用：销售费用22.85亿元、管理费用6.60亿元、研发费用25.35亿元、财务费用1.23亿元，合计约56.02亿元。仅这四项就高于毛利。研发费用同比增加约4.67亿元，销售费用增加约1.99亿元，是利润承压的重要背景。（第72页；增量为计算值）", "管理层解释：上半年加大大模型研发；智能批阅机、影像云、AI眼镜和海外拓展等战略推广费用超过1亿元；学习机受芯片、存储涨价和阶段性缺货影响，销量未达预期。（第7页）", "理解这些解释时，要把“花钱的目的”与“花钱的结果”分开。研发和推广有可能形成未来增长，但半年报不能证明所有投入都能达到预期回报。", "**尤其不要把“归母净利润同比增长14.68%”读成已经盈利。**实际是净亏损由2.39亿元收窄到2.04亿元。扣非净亏损却从3.64亿元扩大至6.37亿元，增加约2.73亿元。（第7页）", "两者的桥梁是非经常性损益：本期税后归母口径约4.33亿元，上年按两种利润口径相减约1.25亿元。也就是：扣非亏损6.37亿元，加上非经常性净收益4.33亿元，最终归母亏损2.04亿元。（第7—8页；上年数为计算值）", "本期非经常性项目主要包括政府补助3.06亿元、相关金融资产收益1.21亿元、非流动资产处置损益0.78亿元；这些是税前分类金额，不能直接与税后归母4.33亿元相加对照。并非全部政府补助都被划为非经常性，扣非也不等于“剔除一切补助后的利润”。（第8、196页）"]}, {"title": "04｜哪些业务在拉动增长，哪些在拖累", "paragraphs": ["**开放平台：收入37.05亿元，增长36.01%，是最主要的收入增量来源。**这一项增加约9.81亿元，超过公司整体增加的7.12亿元；剔除开放平台后，其余业务收入合计约下降3.29%。这是结构分化，并非所有业务同步提速。（第29页；增量和剔除计算为我的计算）", "开放平台毛利率20.21%，同比提高3.63个百分点，是积极信号；但明显低于教育产品和服务的51.72%。因此，同样增加一亿元收入，不同业务带来的毛利不同。公司披露大模型API及MaaS平台服务收入约增长70%，没有在此单独给出该项收入金额，不能把37.05亿元全部叫作“大模型收入”。（第27、30页）", "**智慧教育：收入34.90亿元，下降1.16%，约占总收入30%。**它仍是重要业务，毛利率51.72%，但产品亮点还没有体现为教育板块整体增长。报告没有按教育G、B、C端分别披露收入和利润，不能据此断言“教育B端下降”或“学习机占多少”。（第29—30页）", "**智慧医疗：4.38亿元，增长58.56%。智慧汽车：4.81亿元，增长20.46%。**两项增长较快，但收入占比分别只有3.77%和4.14%。医疗覆盖和汽车出货体现落地规模，尚不能替代独立的盈利与现金流判断。（第13—15、19、29页）", "**需要正视的下滑项：**智能硬件7.32亿元，下降15.96%；信息工程4.64亿元，下降34.99%；运营商8.59亿元，下降3.10%；企业AI解决方案2.26亿元，下降48.62%。数字政府和智慧政法分别增长16.48%、12.00%，也说明“政府相关业务”并非统一涨跌。（第29页）", "这里有两个容易混淆的口径：“智能硬件”位于开放平台及消费者业务分类下，不能当成包含学习机的公司全部硬件；“企业AI解决方案”是财务分类，也不能当成所有面向企业的大模型业务。中标排名、中标金额、确认收入和回款是不同指标。（第24、29页）"]}, {"title": "05｜教育业务：面试需要重点吃透的五条线", "paragraphs": ["报告将智慧教育归纳为五大体系：大课堂、大学情、AI学习机、智慧考试、区域因材施教解决方案。（第11—13页）", "**大课堂：围绕教师备课、课堂教学和师生互动。**包括智慧黑板、智慧课堂、教师发展。公司披露智慧黑板销量同比增长超过80%，智慧课堂民办校业务同比增长超过190%；教师智能体平台“星光”6月上线后两个月注册超12万。最后一个指标跨出了上半年，不能全部归入1—6月业绩。（第12页）", "对产品规划的启发：设备进入教室只是开始，教师能否持续使用、是否节省备课时间、是否适应原有教学流程，决定后续价值。上述销量、业务增幅和注册数的口径也不相同，不能直接横向比较。", "**大学情：围绕作业、批改、错因和后续教学。**重点是智能批阅机、数智化作业等。公司披露智能批阅机签约销售同比增长14倍，累计覆盖5000余所学校；春季学期日均批改作业超360万份；2026年服务到期客户续购率超过90%。（第12页）", "这条线的价值链很清楚：采集作业 → 批改与错因分析 → 形成学情 → 教师调整教学或布置个性化练习 → 再验证掌握情况。对你的岗位而言，它值得重点研究，因为同时包含高频场景、可量化效率、教学反馈和持续服务。需要保留边界：签约销售不是已确认收入；90%是服务到期客户口径，不是所有学校，更不是海外客户续费率。", "**AI学习机：直接服务家庭学习。**它共享教育模型、内容和诊断能力，但购买决策、渠道和产品体验与学校业务不同。公司披露上半年受供应和成本因素影响，销量不及预期；7月销量回升属于期后信息。高端市场占有率、618排名，也不能替代全年收入和利润表现。（第7、12—13页）", "**智慧考试：服务评测与考试组织。**报告称智能评分用于超过50个中高考、学考、研考等项目，全学科全题型智能评分落地17个以上省级教育考试项目。它的核心是评分可信、稳定、公平以及大规模实施能力。面试时不要把某一细分考试市场接近100%的占有率说成“讯飞垄断所有考试”。（第13页）", "**区域因材施教：面向区域的综合方案。**连接教育管理、教研、课堂与学情，报告期新增9个区县，累计服务超过130个市区县。这种模式涉及更多决策者、系统和实施环节。我的判断是：它有整体协同价值，但海外复制难度通常也高，需要先确认预算、交付组织和当地教育体系。（第13页；海外判断为推论）"]}, {"title": "06｜现金流：回款改善为什么仍值得警惕", "paragraphs": ["销售商品、提供劳务收到现金118.96亿元，同比增长约14.82%，快于收入增速；公司还披露第二季度经营现金净额转正。两项都是好信号，但上半年合计仍净流出9.45亿元，上年同期净流出7.72亿元。（第7、76页）", "原因是支出也增加。购买商品和接受劳务支付的现金约86.54亿元，上年66.72亿元；存货较年初增加约9.06亿元、增长29.88%。公司提到存储芯片备货与研发投入增加。回款改善不等于经营现金已经全面改善。（第7、31、76页）", "**应收账款是财务质量的重点。**期末净额172.46亿元，较年初增加9.50亿元，占总资产33.68%。附注显示原始账面余额217.57亿元、坏账准备45.11亿元；账龄超过一年的部分约占原始余额49.4%。（第31、156—158页；占比为计算值）", "长账龄不等于这些钱一定收不回来，坏账准备也不等于本期新损失；但它说明回款周期与信用风险必须持续管理。对产品规划的启发是：项目是否值得做，应同时考虑交付后多久验收、多久收款，不能只看合同金额。", "期末货币资金38.64亿元，比年初增加，不能单独作为经营造血改善的证据。上半年经营现金净流出9.45亿元，投资现金净流出31.16亿元，筹资现金净流入57.05亿元；公司完成约40亿元定增，是现金改善的重要来源。（第31、33、76—77页）", "也不能把投资现金流出全部当成“研发烧钱”：其中包含投资支付、长期资产购建等，报告还披露银行理财余额16.80亿元。须按性质分别理解。（第55、77页）"]}, {"title": "07｜研发、融资和季节性，应该怎么理解", "paragraphs": ["**研发要区分三个数字。**管理层分析中的“研发投入”为30.07亿元，同比增长25.73%；利润表研发费用为25.35亿元；第207页“研发支出”合计37.62亿元，其中费用化25.35亿元、资本化12.27亿元，按该附注口径资本化占比约32.63%。上述口径不同，相关页面未给出完整差异调节，不能混用分子分母计算资本化率。（第28、72、207页）", "资本化意味着部分符合条件的开发成本先形成资产，之后再摊销或减值，不是全部当期进入利润表。这不自动意味着会计有问题，但评估投入回报时要关注资产未来是否真正产生收益。", "本期定增募集资金净额39.81亿元，计划主要投向星火教育大模型及典型产品8亿元、算力平台24亿元、补充流动资金约7.81亿元。它说明公司仍准备持续投入，并为教育和底座能力提供资源；融资成功本身不等于产品已验证盈利。（第33—35页）", "公司解释，上半年政府与大型企业项目规划较多，下半年尤其第四季度验收较集中，费用却全年持续发生。报告所列近三年均存在前三季度扣非亏损、全年转正的现象。因此不能简单把上半年亏损乘二预测全年，也不能因为历史上转正就默认今年必然如此。（第37页）", "本次半年报不安排中期分红；此前2025年度每10股派1元的方案属于年度分红，不矛盾。报告披露无重大诉讼仲裁、无违规对外担保；期末全部担保余额15.61亿元，约占净资产6.83%。（第38、40、46、55页）"]}, {"title": "08｜出海：已经有进展，财务体量仍要看清", "paragraphs": ["公司按地区披露的国外收入为2.89亿元，同比增长61.83%，占总收入2.49%。这表明该口径下增长较快、当前占比仍较小。它不是教育海外收入，也不一定覆盖所有为国内客户提供出海服务的业务，不能直接当成广义出海业务总额。（第29—30页）", "教育方面，半年报披露国际版AI智慧黑板及多语言交互，教育产品已进入日本、新加坡等市场。（第11—12页）", "官网补充披露了几种不同路径：2025年9月推出中文智慧教学系统东盟版，覆盖教学资源生成、练习、口语陪练和HSK模考；2025年12月宣布与印尼金光集团合作，结合设备、软件、教师培训和中文学习支持；2026年8月的公司文章进一步提到日本英语评测与新加坡智能批阅本地适配。它们是产品或合作进展，不能一概说成规模化盈利已验证。[东盟产品发布](https://edu.iflytek.com/about-us/news/company-news/2389.html)；[印尼合作](https://edu.iflytek.com/about-us/news/company-news/2615.html)；[海外业务进展](https://edu.iflytek.com/about-us/news/company-news/2831.html)。", "我的推论：海外战略必须具体到“国家 × 客户 × 学科/语言 × 场景 × 渠道 × 付费方式”。例如中文教学、英语评测和全学科作业批改，对课程内容、评分标准、教师参与及渠道的要求都不相同。把国内产品翻译一下，只解决了很小一部分问题。"]}, {"title": "09｜面试前最值得形成的四个判断", "paragraphs": ["**第一，教育的基础在已有场景与行业能力。**从教学、作业到考试都有产品与应用经验，这是讨论海外机会的出发点。但国内学校覆盖数不能直接证明海外付费需求。", "**第二，增长来自不同产品，不应只讲“教育市场很大”。**教育整体收入略降、部分新产品指标高速增长，产品规划要解释资源为什么向某些方向集中，以及如何验证增长可持续。", "**第三，持续服务值得研究，但不要预设所有客户都适合订阅。**批阅服务续购提供了一个信号，海外还要验证谁付费、预算属于设备还是软件、续费与学期如何对齐。商业模式应与采购现实匹配。", "**第四，教学效果与经营结果必须同时成立。**教师效率、学生学习效果、学校常态化使用、交付成本、续费和回款，合起来才构成产品成功。某次展会、合作签约或模型榜单，只提供其中一部分证据。", "如果继续跟踪下一份财报，优先看：教育收入能否恢复增长；新产品签约如何转为收入和回款；开放平台毛利能否继续改善；扣非利润和经营现金能否同步改善；国外收入增长是否伴随更清晰的区域、产品与盈利披露。"]}, {"title": "10｜回原文时，只需先打开这些页", "paragraphs": ["第7—8页：总体成绩和非经常性损益。第11—13页：教育五大体系与产品指标。第25—27页：核心技术和商业协同。第28—31页：费用、业务收入、毛利和资产。第33—37页：融资用途、风险及季节性。第72—77页：合并利润表与现金流量表。第156—158页：应收账款。第207—208页：研发费用化、资本化和项目。", "无需背诵全部数字。面试优先记住：**教育收入34.90亿元、占约30%、同比略降；批阅服务有高频使用和续购信号；公司在强调经营质量；海外路径需要按本地教育场景拆开。**"]}]}, "interview": {"intro": ["\n# 面试第一课：教育 BG 的业务底图", "当前假设：岗位偏教育B/G端产品战略规划，并重视海外市场；具体事业部、产品线、国家、KPI和C端职责尚未确认。以下用于建立判断框架，不当作已确认JD。\n"], "sections": [{"title": "01｜先区分两个容易混淆的 BG", "paragraphs": ["组织里的BG通常是Business Group，即事业群；客户分类里的B/G端，分别指机构/企业客户与政府客户。你面试“教育BG”，不等于职责一定只包含政府采购，也不能仅凭这个名称排除C端。", "在教育场景中，先用三个入口理解：G端常从教育局、区域建设或考试组织切入；B端常从学校、学校集团及教育机构切入；C端常由家长或学习者购买。公办学校本身也可能涉及财政预算和政府采购，不能把所有学校项目机械归成一种模式。讯飞官网也按教育管理者、学校管理者、教师、家长和学生展示服务。[官网角色与产品导航](https://edu.iflytek.com/)"]}, {"title": "02｜同一个产品，至少有四类不同的人", "paragraphs": ["以“学校采购AI批改服务”为假设案例：老师每天使用，希望批得准、少返工、能发现错误原因；学生接受反馈，希望知道怎么改；校长或教研负责人推动采用，希望教学质量可解释、教师愿意用；最终出资与采购方还会关心预算、交付、验收和服务责任。具体角色分工要到目标国家和学校验证。", "这意味着产品价值有两次检验：采购时有没有理由买，买后是否持续有效使用。演示效果好可能帮助采购，但教师每周常态化使用和次年续费，需要另外的证据。", "一个实用问题是：“如果老师每批一份作业，还要多花几分钟上传、核对和修改，产品究竟节省了多少总时间？”这比只问模型批改准确率更接近产品价值。"]}, {"title": "03｜把五条产品线放回教学流程", "paragraphs": ["课前是备课和资源准备，课堂是讲解互动，课后是作业批改与诊断，阶段末是考试评价，上层还有校级和区域管理。讯飞的大课堂、大学情、考试与区域方案分别进入这些环节；学习机则将部分诊断和辅导能力带到家庭。", "你今天不用背设备型号，先记三件事：产品进入哪个教学环节；谁每天使用、谁出钱；从数据到教学行动是否真正接上。例如批改后只有一张成绩表，和批改后老师能据此调整下一节课，价值不同。"]}, {"title": "04｜产品战略规划岗位要形成怎样的输出", "paragraphs": ["在没有完整JD前，我们先用一个工作假设：这个岗位需要把市场判断转成资源决策。输出可能包括优先市场、目标客户、核心场景、产品组合、合作路径、阶段路线图和验证指标，而不只是一份功能清单。", "用一个句式练习：“我们先服务某国的某类学校，因为它们在某个高频环节有明确问题；通过某个本地伙伴进入，用现有能力加必要的本地适配提供价值；先验证效果、付费和交付，再决定扩张。”", "其中“先做什么”和“暂缓什么”同样重要。若同时承诺多国、多语言、全学科、全流程，资源需求和风险会迅速增加。具体取舍需要客户访谈和试点，而不是凭市场人口排名。"]}, {"title": "05｜出海已经有不同路径，先理解差异", "paragraphs": ["**中文教学路线：**2025年9月发布的东盟版系统，连接教学资源、课堂活动、练习、口语陪练和HSK备考。它以中文学习这一相对明确的需求进入海外。[公司发布](https://edu.iflytek.com/about-us/news/company-news/2389.html)", "**本地学校教学路线：**公司2026年8月披露，在新加坡联合本地教师适配智能批阅，并在日本开展英语口语、作文评测合作。这提示我们，本地评分标准、教材和教师共创会影响产品落地。[公司海外进展](https://edu.iflytek.com/about-us/news/company-news/2831.html)", "**合作伙伴路线：**2025年12月印尼合作披露将设备、个性化学习软件和教师培训结合。需要进一步验证的是伙伴在获客、内容、实施、培训和售后各承担什么，以及这套合作能否重复复制。[印尼合作公告](https://edu.iflytek.com/about-us/news/company-news/2615.html)", "以上是对公开案例的分析归纳，不是讯飞公布的正式战略分类，也不据此给国家排优先级。当前还缺少海外教育业务的分国收入、付费学校数、交付成本、续费和单位经济数据。"]}, {"title": "06｜今天可以形成的60秒表达", "paragraphs": ["“我目前把讯飞教育理解为，以教育模型和行业积累为底座，覆盖课堂、作业学情、考试和区域治理，并延伸到家庭学习的产品体系。2026年半年报里，教育收入约占公司三成，但整体略降，同时批阅等细分产品出现较强的使用和签约信号。因此，如果做海外产品规划，我会先明确目标国家的课程、采购方和高频痛点，再判断哪些能力可以复用、哪些需要本地教师与伙伴共建；通过试点同时验证教学效果、持续使用、付费和交付成本，再决定扩大投入。”", "这只是基于目前信息的表达草稿。后面应结合你的真实经历补充“我如何做过类似判断”，不要把研究结论说成自己的项目经历。"]}, {"title": "07｜接下来的学习顺序", "paragraphs": ["第一步：业务底图——说明产品、用户、采购者和付费者。第二步：挑一个产品——建议先研究智能批阅或语言学习，拆解真实教学工作流与价值证据。第三步：市场选择——结合岗位信息，比较少量目标国家的需求、预算、课程、渠道和进入难度。第四步：产品路线图——写出试点范围、伙伴分工、成功指标与停止条件。第五步：面试表达——将判断与个人履历连接，再做追问练习。", "本轮只要求掌握第一步。你的一个小练习：假设海外学校说“老师批作业太累，我们想引入AI”，你最先想确认的三个问题是什么？不需要标准答案，我们用你的回答继续往下拆。"]}]}, "overseas": {"intro": ["整合日期：2026年10月2日。基于你提供的另一任务研究、半年报，以及本轮核对的公司、合作伙伴、考试机构和教育主管部门资料。下文的三类业务是分析分类，不是公司正式组织架构。没有为三类业务预测收入或排名。\n"], "sections": [{"title": "01｜“证据成熟度”到底是什么", "paragraphs": ["它衡量公开资料把业务证明到了哪一步：有真实使用 → 进入日常教学 → 客户持续付款 → 能以可控的新增交付成本复制。四项需要分别举证，不能只用一个总分代替。", "签约主要证明合作意向或合同关系；演示证明特定环境下的展示；学校覆盖说明触达或部署范围。它们都不能自动证明付费、续费、教学效果或利润。公开资料未披露，也不等于业务实际没有发生。", "在本次收集的案例中，语言教学与评测的海外日常使用证据较丰富；跨学科教师工具有较强的国内使用、续购证据，海外材料侧重适配与应用；学校及区域整体方案有国内组织经验，海外可复制商业模式的公开证据仍有限。这个判断不表示技术优劣，也不构成未来市场大小或投资优先级排名。"]}, {"title": "02｜三条线分别证明到了哪里", "paragraphs": ["**语言教学与评测。**公司2026年8月披露日本相关产品覆盖6000余所学校、年活跃用户超40万，泰国中文系统服务140所院校常态化教学。这支持海外使用规模与教学场景存在，尚不能推出讯飞收入、伙伴分成、付费学校数和续费率，也不能把日本全部覆盖数都归给ELST。[公司披露](https://edu.iflytek.com/about-us/news/company-news/2831.html)", "**跨学科教师工具。**2026年半年报第12页披露国内批阅机累计覆盖5000余所学校、春季日均批改超360万份、当期服务到期客户续购超过90%。新加坡报道呈现当地教师参与、真实材料适配与学校应用；对应的海外付费、续费、教师复核负担和交付成本，所审阅资料未单独披露。[新加坡实践](https://www.iflytek.com/en/news-events/news/280.html)", "**学校及区域整体方案。**国内有区域推广与持续运营案例；海外已见国际版AI黑板与印尼合作。国际版单品、伙伴签约、整校合同、区域长期运营是不同层次，不能从前两者推断后两者已经规模化成立。[印尼合作](https://www.iflytek.com/en/news-events/news/293.html)；半年报第11—13页。"]}, {"title": "03｜泰国数字单独列：72、140、300", "paragraphs": ["2026年6月24日的泰国教育部公告提及72处学校或教学机构的试用情况，并讨论向300所学校提供SaaS使用权及配套培训、学期技术支持。300是拟推进规模，不能记成已交付订单或付费学校。[泰国教育部](https://www.moe.go.th/iflytek-2/)", "2026年8月12日，讯飞文章使用“140所院校常态化中文教学”的口径。两个时点的机构范围、试用/常态化定义及付费状态不同，**不能画成“72→140→300所付费学校”的增长曲线**。应问清每批学校的定义、重合关系、资金来源和合同性质。[讯飞披露](https://edu.iflytek.com/about-us/news/company-news/2831.html)", "核对说明：泰国教育部正文抓取超时，本轮通过该站搜索索引核对了日期、72、300、SaaS及教师培训等核心字段；不据此推断采购金额或付款方。"]}, {"title": "04｜日本：本地伙伴完成产品化，评分进入真实教学", "paragraphs": ["**明确记录的路径。**Sinewave自述2016年与讯飞建立资本及业务合作，教育业务从评分技术许可起步，2018年推出自己的ELST产品。伙伴承担了本地产品化的重要工作，不能仅把它理解成销售代理。[伙伴公司说明](https://sinewave.co.jp/compliments/)", "**信任怎样建立。**英检协会联合研究以日本考生数据比较人工与机器评分。2018年报告排除了约10%的异常录音，并把完全一致或相差一分计为一致，朗读题一致率约98%、回答题平均约95%；异常录音仍需人工处理。这是研究验证，不能表述为正式英检考试全面使用AI评分，更不能写成“完全一致准确率98%”。[联合研究报告，第6—9页](https://www.eiken.or.jp/eiken/group/result/pdf/4s5s-ai_report2018.pdf)", "**教学怎样持续。**伙伴学校案例记录了按教材进度每日布置约15分钟口语作业、教师通过后台检查录音；另一案例以每周任务组织学生练习。产品进入已有的授课、作业、检查与反馈安排，解决老师难以逐一跟踪口语练习的问题。[学校案例](https://sinewave.co.jp/case2021/)", "**可迁移的推论。**在新国家先用本地教材、真实答题、当地评分标准和异常处理建立可信度，再嵌入日常教学。不可直接复制的是日本伙伴的客户、教材关系和商业分工；也不能假设日本现有合作必然代表其他国家的最佳模式。", "**需要内部确认。**谁拥有学校合同与客户关系？讯飞按授权、调用、学生数还是其他方式收费？谁承担内容适配与售后？这些信息决定合作模式能否复制。"]}, {"title": "05｜泰国与沙特：内容之外，学习习惯和教师支持也要设计", "paragraphs": ["**泰国记录的做法。**讯飞案例披露，将本地教材转成配套AI课件、同步课程和题库，并开展教师培训、示范课和校际观摩；部分学校已有持续使用实例。它说明教材适配与教学支持构成落地的一部分，报道中的教学成效仍属于具体案例，不应当作所有学校平均效果。[泰国案例](https://www.iflytek.com/en/news-events/news/332.html)", "**沙特提供的边界。**2026年孔院与讯飞合作的斋月自主学习项目报名超700人，按当地生活节奏设计每日约20分钟内容；复盘明确指出兴趣存在，但持续学习行为尚未稳定。报名规模不能替代留存与学习效果。[孔院项目复盘](https://ci.cn/en/site/1411002000/kyxw/7d754215-a0e0-4f46-b7cc-7725e425d8ed)", "**可迁移的推论。**先找到当地原本就要教的一门课，把教材、任务、教师反馈和支持接起来；自主学习产品则需额外设计持续参与机制。泰国中文需求不能直接用来证明其他国家或学科需求。"]}, {"title": "06｜教师工具：保留原有材料，计算真正的净省时", "paragraphs": ["**国内与海外证据分开。**国内2026年半年报有覆盖、使用量和到期客户续购数据；新加坡2025年9月报道则记录30余位当地教师参与交流，使用商业练习册、学校自编双语试卷和随堂作业验证适配。报道支持“在用本地真实材料推进”，尚不足以量化规模化批改质量和付费意愿。[新加坡报道](https://www.iflytek.com/en/news-events/news/280.html)；半年报第12页。", "**你提供的历史线索。**2024年研发目标强调第三方作业版面和教师习惯；2025年披露3000余所国内学校及超80%的批改服务续费。保留为补充年报线索：本轮已定位两份原报告，但网页文本检索未完整复核对应段落；核心判断以已核对的2026年半年报为准。研发目标仍须与已实现效果分开。[2024年年报](https://disc.static.szse.cn/disc/disk03/finalpage/2025-04-21/dc258dad-4869-48e6-898a-0ec84a9851d3.PDF)；[2025年年报](https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-29/6982b351-77aa-4dc6-93df-4f4d3fe4e9bd.PDF)", "**学校运营方法。**你提供的诸暨学校案例包括提前培训、示范课、一对一支持、检查低使用班级并反馈改进。本轮原链接访问失败，因此将具体细节标为“来自所提供研究，待逐项复核”。可先将其作为试点设计假设；是否采用行政考核必须尊重本地学校机制。[学校运营案例](https://edu.iflytek.com/about-us/news/regional-consultation/2165.html)", "**可迁移的推论。**先进入一项高频任务，兼容教师已有材料，允许复核并帮助使用反馈。试点记录总耗时：准备/扫描、上传、AI处理、人工复核、结果回写。只有与原流程相比净节省时间，才形成可信的效率价值；还应分题型记录漏判、误判和教师修改。"]}, {"title": "07｜整体方案：复制分阶段组织的方法", "paragraphs": ["**蚌埠的研究记录。**先从既有课堂案例构建教学模式，再选三所学校试用、访谈教师并改进，之后区域推广。这里的三所学校是教学模式研究试点，不能改写成三校订单转化为全市合同的销售故事。[案例研究，2022年12月](https://edu.iflytek.com/views-downloads/educational/reading/6)", "**诸暨的区域实践。**2024年教育部门分享的项目覆盖135所学校，围绕智慧作业及其他教育应用推进。它体现区域统筹、具体教学应用和后续发展相结合，不能独立证明海外复制所需的成本与组织条件。[诸暨案例，2024年8月](https://edu.iflytek.com/about-us/news/special-column/1283.html)", "**海外目前能确认的起点。**2025年12月讯飞与金光集团旗下Asix签署智慧教育合作协议。该公告证明伙伴合作与项目启动，没有披露可重复的整校合同价格、长期运营收入或逐校交付成本。[印尼合作公告](https://www.iflytek.com/en/news-events/news/293.html)", "**可迁移的推论。**明确当地教育问题和推进机构 → 小范围共创教学流程 → 教师培训与支持 → 核算下一批学校的新增设备、内容和服务成本 → 再讨论区域方案。国内采购机制、政策推动和交付组织需要在当地重新验证。"]}, {"title": "08｜把案例转为产品规划的验证清单", "paragraphs": ["**阶段一：真实问题。**访谈使用者、推动者、采购者与付费者；拿到真实教材、作业、工作流和预算约束。产出目标客户与核心场景，明确暂不做的范围。", "**阶段二：教学价值。**让同一批教师在可比任务中试用，记录净省时、复核负担、错误类型、持续使用和学生反馈。成效阈值要事先与学校共同约定，不能试点结束再挑好看的指标。", "**阶段三：商业价值。**确认谁付费、价格、合同期限、付款条件、伙伴分工与续购条件。将免费试用、补贴项目和正常采购分别记录。", "**阶段四：复制能力。**追踪新增学校的内容适配工时、安装培训、售后工时、算力服务成本、伙伴分成及回款。这里提出的是未来应验证的指标，不是讯飞已经公布的数据。", "贯穿四阶段的判断：教学效果、客户持续使用和单位经济是否同时成立。机会选择还要结合目标市场、进入条件与团队资源；现有公开证据强，不自动意味着这个岗位下一步就应该优先投入它。"]}, {"title": "09｜二面可以用的三个核心追问", "paragraphs": ["**日本：**“我看到日本有技术合作与当地伙伴产品化路径。团队目前如何划分客户关系、产品迭代、内容和服务责任？对我们做新市场规划，最需要复制的是哪一部分能力？”若交流深度允许，再追问授权、收费与分成方式。", "**泰国：**“公开资料分别用了试用、常态化教学和拟扩校的表述。内部怎样定义这几个阶段，当前主要付费方是谁，从试点转成持续采购最关键的门槛是什么？”", "**新加坡与印尼：**“这两个方向目前分别处于本地验证、付费试点还是持续采购阶段？产品规划接下来最需要解决的是效果、伙伴交付，还是规模化成本？”", "三问共同目的：了解当前阶段及岗位要补的缺口，避免把公开材料包装成已知内部事实。涉及商业敏感信息时，可请对方说明机制和阶段，而不要求具体客户金额。"]}, {"title": "10｜最终保留的战略判断", "paragraphs": ["**共同的可复用方法，是把AI接进当地已经存在的教学安排，并明确谁负责内容、教师使用和持续服务。**语言产品提供了较丰富的海外使用案例；教师工具需要进一步验证本地材料、教师信任与复核负担；整体方案需要证明本地伙伴和逐校交付的经济性。", "这份看板应帮助你提出更好的市场与产品问题，而不是背诵“全球领先”或提前替公司给市场排序。"]}]}}, "business": [["智慧教育", "34.90", "30.03%", "-1.16%", "毛利率51.72%；未拆分教育G/B/C收入"], ["智慧医疗", "4.38", "3.77%", "+58.56%", "增长较快，当前收入体量仍较小"], ["开放平台", "37.05", "31.87%", "+36.01%", "主要增量来源；不能全部视作大模型收入"], ["智能硬件", "7.32", "6.29%", "-15.96%", "该财务分类不等于公司全部硬件"], ["移动互联网产品及服务", "3.73", "3.21%", "+22.00%", "与智能硬件分别列示"], ["信息工程", "4.64", "3.99%", "-34.99%", "项目业务明显收缩"], ["数字政府行业应用", "3.40", "2.93%", "+16.48%", "政府相关业务并非全部下滑"], ["智慧政法行业应用", "2.97", "2.56%", "+12.00%", "与信息工程区分"], ["运营商", "8.59", "7.39%", "-3.10%", "用户规模不能替代当期收入"], ["智慧汽车", "4.81", "4.14%", "+20.46%", "收入增长；出货不等于利润"], ["企业AI解决方案", "2.26", "1.94%", "-48.62%", "不能等同所有企业大模型业务"], ["其他主营业务", "1.87", "1.61%", "+8.63%", "报告分产品口径"], ["其他业务", "0.32", "0.27%", "-11.36%", "四舍五入可能导致合计尾差"]]}</script>
<script>
'use strict';
const {content,business}=JSON.parse(document.getElementById('research-data').textContent);
const tabs=[['report','半年报精华'],['financial','财务与业务'],['evidence','海外证据'],['cases','落地案例与方法'],['interview','面试底图']];
const panel=document.getElementById('panel'),toc=document.querySelector('.toc'),nav=document.querySelector('.tabs'),search=document.getElementById('search');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return s.split(/(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g).map(x=>{if(x.startsWith('**'))return '<strong>'+esc(x.slice(2,-2))+'</strong>';const m=x.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);return m?'<a href="'+esc(m[2])+'" target="_blank" rel="noopener noreferrer">'+esc(m[1])+'</a>':esc(x)}).join('')}
function heading(s){const parts=s.split('｜');return parts.length>1?'<span class="serial">'+esc(parts.shift())+'</span>'+esc(parts.join('｜')):esc(s)}
function section(s,id){return '<article id="'+id+'" data-label="'+esc(s.title)+'"><h2>'+heading(s.title)+'</h2>'+s.paragraphs.map(p=>'<p>'+inline(p)+'</p>').join('')+'</article>'}
function table(headers,rows,cls=''){return '<div class="table-scroll" role="region" aria-label="'+esc(headers[0])+'数据表" tabindex="0"><table class="'+cls+'"><thead><tr>'+headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function block(title,body,id){return '<article id="'+id+'" data-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'</article>'}
function caption(s){return '<p class="caption">'+inline(s)+'</p>'}
const evidenceRows=[['语言教学与评测','日本学校覆盖与活跃用户；泰国院校常态化教学','有公司披露与具体学校案例','海外付费数、续费及讯飞收入未单列','伙伴产品化与教材适配路径可见；新增交付成本未知'],['跨学科教师工具','新加坡真实材料适配、教师交流及学校应用','有海外应用报道；缺少连续量化数据','国内到期客户续购＞90%；不可外推海外','多语言、多题型、复核负担与成本待验证'],['学校及区域整体方案','国际版AI黑板、印尼伙伴合作','国内区域实践充分；海外整套运营证据有限','海外整校长期合同与续费未见详细披露','伙伴分工、逐校实施与长期服务成本待验证']];
function renderEvidenceTable(filter='全部'){document.getElementById('evidence-table').innerHTML=table(['方向','真实使用','日常教学','持续付款','可控复制'],evidenceRows.filter(r=>filter==='全部'||r[0]===filter),'matrix')}
function render(key){
 document.querySelectorAll('.tab').forEach(b=>{const active=b.dataset.tab===key;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1});
 panel.setAttribute('aria-labelledby','tab-'+key);search.value='';document.getElementById('status').textContent='';
 let html='';
 if(key==='report'){
  html='<p class="lead">业务扩张已有落地，盈利质量和海外商业复制仍需分开验证。</p><div class="kpis">'+[['116.23亿元','总营收 · 同比+6.52%'],['-6.37亿元','扣非归母净利润 · 亏损扩大'],['34.90亿元','智慧教育收入 · 同比-1.16%']].map(([a,b])=>'<div class="kpi"><strong>'+a+'</strong><span>'+b+'</span></div>').join('')+'</div>'+caption('来源：半年报第7、29页；人民币；2026年1—6月。财务报告未经审计。')+'<div class="intro">'+content.report.intro.map(p=>'<p>'+inline(p)+'</p>').join('')+'</div>'+content.report.sections.map((s,i)=>section(s,'report-'+i)).join('');
 }else if(key==='financial'){
  html=block('利润与现金：两种利润口径方向不同',table(['指标（亿元）','2025上半年','2026上半年','如何解读'],[['营业收入','109.11','116.23','增长6.52%'],['归母净利润','-2.39','-2.04','亏损收窄；仍未盈利'],['扣非归母净利润','-3.64','-6.37','亏损扩大约2.73亿元'],['非经常性损益（税后归母）','1.25','4.33','上年由两种利润口径相减计算'],['经营现金流净额','-7.72','-9.45','净流出增加'],['销售回款','103.61','118.96','增长约14.82%；支出也增加']],'smalltable')+caption('来源：半年报第7—8、76页。上年非经常性损益、回款增速为计算值；金额已四舍五入。'),'fin-0')+
  block('各业务收入：2026上半年',table(['财务分类','收入（亿元）','收入占比','同比','阅读提示'],business,'smalltable')+caption('来源：半年报第29—30页。分产品口径，不代表组织架构；总营收116.23亿元。'),'fin-1')+
  block('三个容易混淆的研发数字',table(['口径','亿元','出处／边界'],[['管理层分析：研发投入','30.07','第28页；同比+25.73%'],['利润表：研发费用','25.35','第72页；费用化进入当期损益'],['附注：研发支出合计','37.62','第207页；费用化25.35、资本化12.27']])+caption('资本化占比32.63%按第207页计算；相关页面未给出完整口径差异调节，不能混用。'),'fin-2')+
  block('资金与资产：2026年6月30日',table(['项目','金额（亿元）','观察重点'],[['应收账款净额','172.46','原始余额217.57；坏账准备45.11'],['存货','39.37','较年初增加约9.06，增长29.88%'],['货币资金','38.64','余额改善有定增与筹资支持'],['定增募集资金净额','39.81','报告期流量；教育、算力与补流用途']])+caption('来源：半年报第31、33—35、156—158页。最后一行为期间流量，其余为期末余额；存货增速为计算值。'),'fin-3');
 }else if(key==='evidence'){
  html=section(content.overseas.sections[0],'evidence-0')+
  block('商业验证需要四种证据','<div class="evidence-steps">'+[['01','真实使用','明确客户、场景及使用范围'],['02','日常教学','连续使用与教学反馈'],['03','持续付款','付费方、续费、合同与回款'],['04','可控复制','交付成本、伙伴分工与毛利']].map(([n,t,d])=>'<div class="step"><small>'+n+'</small><b>'+t+'</b><small>'+d+'</small></div>').join('')+'</div><div class="notice">评价的是公开证据的覆盖程度。未披露不等于没有发生，也不代表技术、收入或市场前景排名。</div><div class="filter" aria-label="按业务方向筛选">'+['全部',...evidenceRows.map(r=>r[0])].map((n,i)=>'<button type="button" class="plain-btn" data-filter="'+n+'" aria-pressed="'+(i===0)+'">'+n+'</button>').join('')+'</div><div id="evidence-table"></div>'+caption('来源：[公司海外披露](https://edu.iflytek.com/about-us/news/company-news/2831.html)、[新加坡实践](https://www.iflytek.com/en/news-events/news/280.html)、[印尼合作](https://www.iflytek.com/en/news-events/news/293.html)、半年报第12页。定性证据矩阵，非量化排名。'),'evidence-1')+
  section(content.overseas.sections[1],'evidence-2')+section(content.overseas.sections[2],'evidence-3')+
  block('泰国三个数字：不同时间、不同口径',table(['时间／发布方','数量','口径','不能推断'],[['2026年6月／泰国教育部','72处','试用机构','全部付费或持续使用'],['2026年8月／讯飞','140所','院校常态化教学','72→140的同口径增长'],['2026年6月／泰国教育部','拟300所','讨论SaaS使用权与支持','已交付或已付费300所']],'smalltable')+caption('来源同上节：泰国教育部2026年6月公告、讯飞2026年8月披露。'),'evidence-4')+section(content.overseas.sections[9],'evidence-5');
 }else if(key==='cases'){
  html='<p class="lead">从案例中提取能复用的方法，也保留不能外推的边界。</p>'+caption('按“记录的做法 → 证据边界 → 可迁移推论 → 内部待确认”整理。未完成原文复核的补充线索已单独标识。')+content.overseas.sections.slice(3,9).map((s,i)=>section(s,'cases-'+i)).join('');
 }else{
  html='<div class="intro">'+content.interview.intro.map(p=>'<p>'+inline(p)+'</p>').join('')+'</div>'+content.interview.sections.map((s,i)=>section(s,'interview-'+i)).join('');
 }
 panel.innerHTML=html;
 toc.innerHTML=[...panel.querySelectorAll('article')].map(a=>'<a href="#'+a.id+'">'+esc(a.dataset.label.replace(/^\d+｜/,''))+'</a>').join('');
 if(key==='evidence'){renderEvidenceTable();panel.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{panel.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderEvidenceTable(b.dataset.filter)}))}
 document.title=tabs.find(t=>t[0]===key)[1]+' · 科大讯飞研究';
}
nav.innerHTML=tabs.map(([key,label])=>'<button class="tab" type="button" role="tab" aria-controls="panel" aria-selected="false" data-tab="'+key+'" id="tab-'+key+'">'+label+'</button>').join('');
nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){history.replaceState(null,'','#'+b.dataset.tab);render(b.dataset.tab)}});
nav.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...nav.querySelectorAll('button')];let n=bs.indexOf(document.activeElement);n=e.key==='Home'?0:e.key==='End'?bs.length-1:(n+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[n].click();bs[n].focus()});
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let shown=0;panel.querySelectorAll('article').forEach(a=>{const hit=!q||a.textContent.toLowerCase().includes(q);a.hidden=!hit;if(hit)shown++;const link=toc.querySelector('a[href="#'+a.id+'"]');if(link)link.hidden=!hit});document.getElementById('status').textContent=q?(shown?'找到 '+shown+' 个相关章节':'当前页没有匹配章节，请更换关键词或切换栏目。'):''});
document.getElementById('print').addEventListener('click',()=>window.print());
function route(){const hash=location.hash.slice(1);const key=tabs.find(t=>hash===t[0]||hash.startsWith(t[0]+'-'))?.[0]||(hash.startsWith('fin-')?'financial':null);if(key||!panel.children.length)render(key||'report');const target=document.getElementById(hash);if(target)target.scrollIntoView()}
window.addEventListener('hashchange',route);route();
</script>
